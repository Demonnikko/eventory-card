<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual"
    />
    <meta name="theme-color" content="#090705" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Визитка" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="Бесплатная электронная визитка для event-специалистов: контакты, услуги, QR-код и ссылка."
    />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="preload" as="image" type="image/webp" fetchpriority="high" href="/business-card-templates/onboarding/host-card.webp" />
    <link rel="preload" as="image" type="image/webp" fetchpriority="high" href="/business-card-templates/onboarding/illusionist-card.webp" />
    <link rel="preload" as="image" type="image/webp" fetchpriority="high" href="/business-card-templates/onboarding/vocalist-card.webp" />
    <link rel="preload" as="image" type="image/webp" fetchpriority="high" href="/business-card-templates/onboarding/organizer-card.webp" />
    <title>Визитка</title>
  </head>
  <body>
    <header class="ca-header">
      <img class="ca-header-mark" src="/icon-192.png" alt="" aria-hidden="true" />
      <div>
        <div class="ca-header-title">Визитка</div>
      </div>
      <button type="button" class="ca-update-control" data-pwa-update-control hidden>
        Обновить
      </button>
    </header>
    <div class="ca-update-banner" data-pwa-update-banner role="status" hidden>
      <span data-pwa-update-status>Доступна новая версия визитки</span>
      <button type="button" data-pwa-update-action>Обновить</button>
    </div>
    <div id="app"></div>
    <nav id="tabbar" class="ca-tabbar" role="tablist" aria-label="Разделы приложения" hidden></nav>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
