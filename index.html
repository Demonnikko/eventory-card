<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual"
    />
    <meta name="theme-color" content="#060607" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Визитка" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="Бесплатная электронная визитка для event-специалистов: контакты, услуги, QR-код и ссылка."
    />
    <!-- iPhone берёт иконку экрана «Домой»: универсальная ссылка + precomposed для всех разрешений Retina -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="240x240" href="/apple-touch-icon-240x240.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120x120.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png" />
    <link rel="apple-touch-icon-precomposed" sizes="240x240" href="/apple-touch-icon-240x240-precomposed.png" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon-180x180-precomposed.png" />
    <link rel="apple-touch-icon-precomposed" sizes="120x120" href="/apple-touch-icon-120x120-precomposed.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <!-- Шаблоны онбординга не preload'им в HTML: они нужны только на первом
         входе владельца, а грузились на КАЖДОЙ странице, включая публичную
         визитку клиента (лишние ~230 КБ). Онбординг предзагружает их сам из
         JS при показе экрана профессий. -->
    <title>Визитка</title>
  </head>
  <body>
    <!-- Заголовок у каждого экрана свой; в шапке остаётся только кнопка
         обновления приложения: она появляется, когда вышла новая версия. -->
    <header class="ca-header">
      <button type="button" class="ca-update-control" data-pwa-update-control hidden>
        Обновить
      </button>
    </header>
    <div class="ca-update-banner" data-pwa-update-banner role="status" hidden>
      <span data-pwa-update-status>Доступна новая версия визитки</span>
      <button type="button" data-pwa-update-action>Обновить</button>
    </div>
    <div id="app">
      <div class="ca-splash" style="min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #060607;">
        <div style="width: 44px; height: 44px; border-radius: 11px; background: linear-gradient(135deg, #d9cbb0, #a69880); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(217, 203, 176, 0.25); margin-bottom: 14px;">
          <span style="font-size: 22px; font-weight: 700; color: #060607; font-family: -apple-system, BlinkMacSystemFont, sans-serif;">В</span>
        </div>
        <div style="font-size: 13px; font-weight: 600; color: #a69880; letter-spacing: 0.08em; text-transform: uppercase; font-family: -apple-system, BlinkMacSystemFont, sans-serif;">Визитка</div>
      </div>
    </div>
    <nav id="tabbar" class="ca-tabbar" aria-label="Навигация" hidden></nav>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
