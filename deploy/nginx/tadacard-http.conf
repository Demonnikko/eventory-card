# Этап 1: до сертификата. Сайт целиком по http — чтобы проверить его
# до переключения домена и выпустить сертификат Let's Encrypt.
# После выпуска заменяется на tadacard-https.conf.
server {
    listen 80;
    listen [::]:80;
    server_name tadacard.ru www.tadacard.ru;

    include snippets/tadacard-locations.conf;
}
