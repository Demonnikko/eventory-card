# Заголовки защиты визитки — те же, что в vercel.json.
# Отдельным файлом: nginx не наследует add_header в location со своими
# add_header, поэтому их подключают и на уровне server, и в таких location.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://eventory-mvp.vercel.app https://vercel.com https://*.blob.vercel-storage.com; media-src 'self' blob: data: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
