# Этап 2: рабочая схема. http → https, www → без www.
server {
    listen 80;
    listen [::]:80;
    server_name tadacard.ru www.tadacard.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://tadacard.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.tadacard.ru;

    ssl_certificate /etc/letsencrypt/live/tadacard.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tadacard.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://tadacard.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tadacard.ru;

    ssl_certificate /etc/letsencrypt/live/tadacard.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tadacard.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/tadacard-locations.conf;
}
