# Визитка (tadacard.ru): настройки уровня http. Ставится в /etc/nginx/conf.d/.

# Кэш фото и видео (/media/). Потолок 512 МБ: старое вытесняется само,
# диск сервера, общий с Sales и kostyukproject.ru, не переполнится.
proxy_cache_path /var/cache/nginx/card_media levels=1:2 keys_zone=card_media:10m
                 max_size=512m inactive=30d use_temp_path=off;

# Vercel по DNS каждый раз выдаёт разные адреса, и часть из них из РФ
# блокируется на этапе TLS (проверено 12.10.2026: *.3 и *.131 — нет,
# эти — 3 из 3). Любой адрес Vercel обслуживает любой проект по имени
# (SNI), поэтому закрепляем проходящие. Заблокируют один — nginx за
# 4 секунды уйдёт на следующий и минуту не будет его трогать.
upstream vercel_edge {
    server 76.76.21.21:443 max_fails=1 fail_timeout=60s;
    server 216.198.79.1:443 max_fails=1 fail_timeout=60s;
    server 64.29.17.1:443 max_fails=1 fail_timeout=60s;
    server 216.198.79.195:443 max_fails=1 fail_timeout=60s;
    server 76.76.21.9:443 max_fails=1 fail_timeout=60s;
    keepalive 8;
}
