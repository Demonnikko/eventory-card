# Общие настройки прокси на Vercel для /api/ и /v/ (подключается из tadacard-locations.conf).
proxy_ssl_server_name on;
# К проекту визитки ходим под отдельным техническим именем
# tadacard-edge.vercel.app (добавлено в проект 22.10.2026). Почему не другие:
#   eventory-card.vercel.app — Vercel показывает нашему серверу «проверку на
#     робота» (403 на всё);
#   tadacard.ru — провайдеры РФ замораживают соединение к зарубежному адресу
#     с этим именем после ~16 КБ: фото и видео не доходили.
proxy_ssl_name tadacard-edge.vercel.app;
proxy_ssl_session_reuse on;
proxy_set_header Host tadacard-edge.vercel.app;
# POST повторяем на другой адрес, только если он не успел уйти
# (блокировка срабатывает на TLS) — вопрос гостя не задвоится.
proxy_next_upstream error timeout http_502 http_504;
proxy_next_upstream_tries 3;
proxy_set_header X-Card-Public-Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP $remote_addr;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_connect_timeout 4s;
proxy_read_timeout 60s;
client_max_body_size 2m;
# Vercel ставит такие же заголовки защиты; оставляем по одному — наши.
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
