# Визитка на российском сервере (tadacard.ru): общие правила для http и https.
#
# Страницы и сборка лежат здесь же (/var/www/tadacard/current) — открываются
# без VPN. Всё живое — данные визиток, отзывы, статистика, превью для
# мессенджеров — по-прежнему считает Vercel: проксируем туда с сервера, до
# которого блокировки не доходят. Фото и видео из Vercel Blob отдаём через
# /media/ с кэшем на диске (не больше 512 МБ), загрузки — через /blob-api/.
# Файл подключается в sites-available/tadacard; источник — Card/Код/deploy/nginx.

root /var/www/tadacard/current;
index index.html;

resolver 77.88.8.8 1.1.1.1 valid=300s ipv6=off;
resolver_timeout 5s;

include snippets/tadacard-headers.conf;

location ~ /\.(?!well-known/) {
    return 404;
}

location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
}

# Живые функции и публичные страницы /v/… (og-теги) — на Vercel.
# Внутри Vercel /api/card-get, /api/promo и т.п. уходят в основной Eventory.
location ^~ /api/ {
    include snippets/tadacard-vercel-proxy.conf;
    proxy_pass https://vercel_edge;
}

# Vercel кэширует страницу /v/ на 5 минут и не смотрит на заголовок
# X-Card-Public-Host. Метка pub=ru в адресе даёт российскому серверу свою
# копию в кэше — иначе гости одного домена получали бы превью другого.
location ^~ /v/ {
    include snippets/tadacard-vercel-proxy.conf;
    proxy_pass https://vercel_edge$uri?pub=ru&$args;
}

# Фото и видео из Vercel Blob. Путь проверен регуляркой: только хранилища
# Blob, никакого открытого прокси на чужие сайты.
location ~ "^/media/([a-z0-9]{8,40})/([A-Za-z0-9._/-]+)$" {
    set $blob_host $1.public.blob.vercel-storage.com;
    set $blob_path $2;
    slice 1m;
    proxy_cache card_media;
    proxy_cache_key $blob_host/$blob_path$slice_range;
    proxy_set_header Range $slice_range;
    proxy_cache_valid 200 206 30d;
    proxy_cache_valid 404 1m;
    proxy_cache_lock on;
    proxy_pass https://$blob_host/$blob_path;
    proxy_ssl_server_name on;
    proxy_ssl_name $blob_host;
    proxy_set_header Host $blob_host;
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_ignore_headers Set-Cookie;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Загрузка обложек и видеоотзывов: адрес выдаёт /api/card-*-upload,
# файл идёт потоком, без записи на диск сервера.
location ^~ /blob-api/ {
    proxy_pass https://vercel.com/api/blob/;
    proxy_ssl_server_name on;
    proxy_set_header Host vercel.com;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    client_max_body_size 13m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

# Сборка: файлы с хешем в имени — навсегда, точка входа и Service Worker — всегда свежие.
location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Шаблоны визиток и онбординг-превью: неизменяемые текстуры кэшируем надолго для мгновенной загрузки.
location ^~ /business-card-templates/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    try_files $uri =404;
}

location = /sw.js {
    include snippets/tadacard-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
}

location = /index.html {
    include snippets/tadacard-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

# Манифест приложения — со своим типом (в mime.types nginx его нет).
location = /manifest.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
}

# Иконки Apple Touch (Safari на iPhone запрашивает разные размеры apple-touch-icon-*.png).
# Если точного файла нет, отдаём базовую apple-touch-icon.png вместо 404, чтобы Safari
# никогда не сбрасывал иконку на скриншот страницы.
location ~* ^/apple-touch-icon.*\.png$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri /apple-touch-icon.png =404;
}

# Файлы (картинки, иконки и т.п.), которых нет, — честный 404, а не
# страница приложения: iPhone ищет /apple-touch-icon-precomposed.png и,
# получив HTML, ставит на экран «Домой» пустую иконку.
location ~* \.(?:png|jpe?g|webp|gif|svg|ico|webmanifest|json|txt|xml|js|css|woff2?|ttf|map)$ {
    try_files $uri =404;
}

location / {
    try_files $uri /index.html;
}
