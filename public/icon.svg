<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Фон плитки: тёплый тёмно-коричневый, светлее к верхнему левому углу.
         Свет задан самим градиентом, без отдельной фигуры — иначе на краю
         подсветки видна резкая дуга. -->
    <radialGradient id="tile" cx="30%" cy="20%" r="105%">
      <stop offset="0" stop-color="#33333a"/>
      <stop offset="0.35" stop-color="#232328"/>
      <stop offset="0.7" stop-color="#17171a"/>
      <stop offset="1" stop-color="#0d0d0f"/>
    </radialGradient>

    <!-- Золото рамки: свет сверху-слева, низ уходит в тень -->
    <linearGradient id="frame" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#f7f1e4"/>
      <stop offset="0.18" stop-color="#e4dac6"/>
      <stop offset="0.45" stop-color="#c9bda3"/>
      <stop offset="0.72" stop-color="#9a8e78"/>
      <stop offset="1" stop-color="#665f52"/>
    </linearGradient>

    <!-- Боковая грань: тёмное золото, читается как торец карточки -->
    <linearGradient id="edge" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#a0947e"/>
      <stop offset="0.55" stop-color="#726a5c"/>
      <stop offset="1" stop-color="#464137"/>
    </linearGradient>

    <!-- Поверхность карточки: почти чёрная, с тёплым отсветом сверху -->
    <linearGradient id="face" x1="0.25" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#2b2b30"/>
      <stop offset="0.4" stop-color="#1a1a1d"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>

    <!-- Матовая фактура -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>

    <!-- Мягкая тень под карточкой -->
    <filter id="drop" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="4" dy="26" stdDeviation="32" flood-color="#000" flood-opacity="0.7"/>
    </filter>

    <clipPath id="tileClip">
      <rect x="52" y="52" width="920" height="920" rx="216"/>
    </clipPath>
  </defs>

  <!-- ФОН -->
  <g clip-path="url(#tileClip)">
    <rect x="52" y="52" width="920" height="920" fill="url(#tile)"/>
    <rect x="52" y="52" width="920" height="920" filter="url(#grain)" fill="#83838a"/>
  </g>

  <!-- КАРТОЧКА -->
  <g transform="rotate(-7 512 512)" filter="url(#drop)">
    <!-- Торец: сдвиг вправо-вниз создаёт видимую толщину -->
    <rect x="240" y="322" width="576" height="398" rx="34" fill="url(#edge)"/>

    <!-- Золотая рамка со срезанным левым нижним углом -->
    <path d="M 252 300
             L 772 300
             A 36 36 0 0 1 808 336
             L 808 664
             A 36 36 0 0 1 772 700
             L 288 700
             L 216 628
             L 216 336
             A 36 36 0 0 1 252 300 Z"
          fill="url(#frame)"/>

    <!-- Тёмная поверхность: повторяет силуэт рамки с отступом -->
    <path d="M 264 315
             L 768 315
             A 22 22 0 0 1 790 337
             L 790 663
             A 22 22 0 0 1 768 685
             L 294 685
             L 231 622
             L 231 337
             A 22 22 0 0 1 253 315 Z"
          fill="url(#face)"/>

    <!-- Блик по верхней кромке -->
    <path d="M 268 301 L 762 301" stroke="#f6f2ea" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
    <!-- Блик по левой кромке, короткий -->
    <path d="M 217 350 L 217 560" stroke="#f6f2ea" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
  </g>
</svg>
