<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="22%" r="78%">
      <stop offset="0" stop-color="#16171b"/>
      <stop offset="1" stop-color="#07080b"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8dd8e"/>
      <stop offset="0.52" stop-color="#e9b34f"/>
      <stop offset="1" stop-color="#bb7319"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Карточка: узнаваемый силуэт визитки -->
  <g filter="url(#shadow)">
    <rect x="96" y="146" width="320" height="220" rx="28" fill="url(#gold)"/>
    <rect x="96" y="146" width="320" height="220" rx="28" fill="url(#sheen)"/>
  </g>

  <!-- Аватар и строки контакта -->
  <circle cx="168" cy="228" r="30" fill="#2a1c08" opacity="0.55"/>
  <rect x="216" y="206" width="150" height="18" rx="9" fill="#2a1c08" opacity="0.55"/>
  <rect x="216" y="238" width="104" height="14" rx="7" fill="#2a1c08" opacity="0.38"/>
  <rect x="136" y="292" width="230" height="14" rx="7" fill="#2a1c08" opacity="0.30"/>
  <rect x="136" y="320" width="164" height="14" rx="7" fill="#2a1c08" opacity="0.22"/>
</svg>
